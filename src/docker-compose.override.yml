services:
    
    catalogdb:
        container_name: catalogdb
        restart: always
         
        environment:
          POSTGRES_USER_FILE: /run/secrets/postgres_user         
          POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password 
          POSTGRES_DB_FILE: /run/secrets/postgres_catalogdb

        secrets:
          - postgres_user
          - postgres_password
          - postgres_catalogdb
        ports:
            - "5432:5432"
        volumes:
          - ./postgres_catalogDb:/var/lib/postgresql/data/
   
    basketdb:
        container_name: basketdb
        restart: always
         
        environment:
          POSTGRES_USER_FILE: /run/secrets/postgres_user         
          POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password 
          POSTGRES_DB_FILE: /run/secrets/postgres_basketdb

        secrets:
          - postgres_user
          - postgres_password
          - postgres_basketdb
        ports:
            - "5433:5432"
        volumes:
          - ./postgres_basketDb:/var/lib/postgresql/data/

    adminer:
         restart: always
         ports:
             - 8080:8080
    
    distributedcache:
        container_name: distributedcache
        restart: always
        ports:
            - "6379:6379"
    
    orderdb:
        container_name: orderdb
        environment:
          - ACCEPT_EULA=Y
          - SA_PASSWORD=P@ssw0rd123
        restart: always
        ports:
           - "1435:1433"


    catalog.api:
      environment:
          - ASPNETCORE_ENVIRONMENT=Development
          - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/Catalog.API.pfx
          - ASPNETCORE_Kestrel__Certificates__Default__Password=123456 
          - ASPNETCORE_HTTP_PORTS=8080
          - ASPNETCORE_HTTPS_PORTS=8081
          - ConnectionStrings__Database=Host=catalogdb;Port=5432;Database=CatalogDb;Username=postgres;Password=postgres;Include Error Detail=true
      depends_on:
          - catalogdb
      ports:
          - "6000:8080"
          - "6060:8081"
      volumes:
          - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
          - ${APPDATA}/ASP.NET/Https/EShop_WebApp_Cert:/home/app/.aspnet/https:ro
    
    basket.api:
      environment:
          - ASPNETCORE_ENVIRONMENT=Development
          - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/Basket.API.pfx
          - ASPNETCORE_Kestrel__Certificates__Default__Password=123456 
          - ASPNETCORE_HTTP_PORTS=8080
          - ASPNETCORE_HTTPS_PORTS=8081
          - ConnectionStrings__Database=Host=basketdb;Port=5432;Database=BasketDb;Username=postgres;Password=postgres;Include Error Detail=true
          - ConnectionStrings__Redis=distributedcache:6379 
          - GrpcSettings__DiscountUrl=https://discount.grpc:8081
      depends_on:
           - basketdb
           - distributedcache
           - discount.grpc
      ports:
           - "6001:8080"
           - "6061:8081"
      volumes:
           - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
           - ${APPDATA}/ASP.NET/Https/EShop_WebApp_Cert:/home/app/.aspnet/https:ro
    
    discount.grpc:
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/Discount.Grpc.pfx
        - ASPNETCORE_Kestrel__Certificates__Default__Password=123456 
        - ASPNETCORE_HTTP_PORTS=8080
        - ASPNETCORE_HTTPS_PORTS=8081
        - ConnectionStrings__Database=Data Source=discountdb
      ports:
        - "6002:8080"
        - "6062:8081"
      volumes:
        - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        - ${APPDATA}/ASP.NET/Https/EShop_WebApp_Cert:/home/app/.aspnet/https:ro

